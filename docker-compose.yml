version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: collegium-db
    restart: always
    environment:
      POSTGRES_USER: collegium_user
      POSTGRES_PASSWORD: collegium_password
      POSTGRES_DB: collegium_dev
    ports:
      - "5432:5432"
    volumes:
      - collegium-db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: collegium_redis
    ports:
      - '6379:6379'

# we will add redis here for caching but not now

volumes:
  collegium-db-data:


